name: Test and build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android version code (must increase for every phone update)"
        required: false
        default: "5"
      version_name:
        description: "Visible version name"
        required: false
        default: "5.0.0"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Unit tests, lint and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: advance-medical-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  migration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room migration instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            chmod +x ./gradlew
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

  signed-release:
    needs: [verify, migration-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLINIC_KEYSTORE_BASE64: ${{ secrets.CLINIC_KEYSTORE_BASE64 }}
      CLINIC_STORE_PASSWORD: ${{ secrets.CLINIC_STORE_PASSWORD }}
      CLINIC_KEY_ALIAS: ${{ secrets.CLINIC_KEY_ALIAS }}
      CLINIC_KEY_PASSWORD: ${{ secrets.CLINIC_KEY_PASSWORD }}
      CLINIC_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      CLINIC_VERSION_NAME: ${{ inputs.version_name || '5.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Signing status
        if: env.CLINIC_KEYSTORE_BASE64 == ''
        run: echo "Signed release skipped until the four CLINIC_* signing secrets are configured."
      - name: Restore release keystore
        if: env.CLINIC_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$CLINIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clinic-release.jks"
          echo "CLINIC_KEYSTORE_PATH=$RUNNER_TEMP/clinic-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.CLINIC_KEYSTORE_BASE64 != ''
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: env.CLINIC_KEYSTORE_BASE64 != ''
        with:
          name: advance-medical-release-${{ env.CLINIC_VERSION_CODE }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
