name: Build signed migration bridge and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android version code"
        required: false
      version_name:
        description: "Visible version name"
        required: false
        default: "5.0.0"

permissions:
  contents: read

jobs:
  signed-migration-update:
    runs-on: ubuntu-latest
    env:
      CLINIC_KEYSTORE_BASE64: ${{ secrets.CLINIC_KEYSTORE_BASE64 }}
      CLINIC_STORE_PASSWORD: ${{ secrets.CLINIC_STORE_PASSWORD }}
      CLINIC_KEY_ALIAS: ${{ secrets.CLINIC_KEY_ALIAS }}
      CLINIC_KEY_PASSWORD: ${{ secrets.CLINIC_KEY_PASSWORD }}
      CLINIC_VERSION_CODE: ${{ inputs.version_code || format('200{0}', github.run_number) }}
      CLINIC_VERSION_NAME: ${{ inputs.version_name || '5.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate signing secrets
        run: |
          test -n "$CLINIC_KEYSTORE_BASE64"
          test -n "$CLINIC_STORE_PASSWORD"
          test -n "$CLINIC_KEY_ALIAS"
          test -n "$CLINIC_KEY_PASSWORD"
      - name: Restore permanent signing key
        run: |
          printf '%s' "$CLINIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clinic-release.jks"
          echo "CLINIC_KEYSTORE_PATH=$RUNNER_TEMP/clinic-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace
      - name: Upload migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: advance-medical-migration-and-release-${{ env.CLINIC_VERSION_CODE }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
